<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>NLCIL Meal Portal</title>

    <!-- PWA: lets mobile browsers offer "Add to Home Screen" / "Install app",
         so the portal launches full-screen without browser chrome. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f1730" />
    <meta name="background-color" content="#f3f4f8" />

    <!-- Android / Chrome -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- iOS Safari doesn't read manifest.json for the home-screen icon or
         standalone behavior — these three tags are what actually make
         "Add to Home Screen" work well on iPhone/iPad. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meal Portal" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
